name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Genera le cartelle di piattaforma mancanti (non sovrascrive i file
      # Android già presenti nel repo: manifest, splash, stili).
      - name: Crea progetto Android
        run: |
          flutter create --org it.img2pdf --project-name img2pdf --platforms android .
          rm -f test/widget_test.dart
          # receive_sharing_intent richiede compileSdk 37
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' android/app/build.gradle.kts
          grep -n "compileSdk" android/app/build.gradle.kts
          echo "android.suppressUnsupportedCompileSdk=37" >> android/gradle.properties

      - run: flutter pub get

      - name: Analisi codice
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Compila APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: img2pdf-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Copia dell'APK nel ramo "apk" (scaricabile anche senza artefatti).
      - name: Pubblica APK nel ramo apk
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/img2pdf.apk
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf --cached . -q
          cp /tmp/img2pdf.apk img2pdf.apk
          git add -f img2pdf.apk
          git commit -m "APK build ${{ github.run_number }}"
          git push -f origin apk

      # In caso di errore pubblica i log nel ramo "ci-logs" per poterli leggere.
      - name: Pubblica log
        if: failure()
        run: |
          mkdir -p /tmp/ci && cp analyze.log build.log /tmp/ci/ 2>/dev/null || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . -q
          cp /tmp/ci/*.log . 2>/dev/null || true
          git add -f *.log
          git commit -m "Log build ${{ github.run_number }}"
          git push -f origin ci-logs
