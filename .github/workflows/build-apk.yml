name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Genera le cartelle di piattaforma mancanti (non sovrascrive
      # AndroidManifest.xml già presente nel repo).
      - name: Crea progetto Android
        run: flutter create --org it.img2pdf --project-name img2pdf --platforms android .

      - run: flutter pub get

      - name: Compila APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: img2pdf-apk
          path: build/app/outputs/flutter-apk/app-release.apk
